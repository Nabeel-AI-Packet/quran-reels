# Every Monday: renew the Instagram token and send weekly stats
name: refresh
on:
  schedule:
    - cron: '13 8 * * 1'
  workflow_dispatch:
concurrency:
  group: reel-agent
  cancel-in-progress: false
jobs:
  agent:
    uses: ./.github/workflows/_run.yml
    with:
      command: refresh
    secrets: inherit
