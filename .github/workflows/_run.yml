# Shared steps: install tools, run one agent command, save changes back to the repo.
name: run-agent
on:
  workflow_call:
    inputs:
      command: {required: true, type: string}
    secrets:
      TELEGRAM_TOKEN: {required: true}
      TELEGRAM_CHAT_ID: {required: false}
      UPLOADPOST_API_KEY: {required: false}
      UPLOADPOST_USER: {required: false}
      IG_TOKEN: {required: false}
      IG_USER_ID: {required: false}
      GH_PAT: {required: false}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-hosny-amiri fonts-inter libraqm0 fontconfig > /dev/null
          pip install -q requests pillow
      - name: Run agent
        id: run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_USER: ${{ secrets.UPLOADPOST_USER }}
          POSTER: ${{ vars.POSTER }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m agent.main ${{ inputs.command }}
      - name: Save the new Instagram token
        if: inputs.command == 'refresh' && steps.run.outputs.token != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set IG_TOKEN --body "${{ steps.run.outputs.token }}" --repo "$GITHUB_REPOSITORY"
      - name: Save queue, state and videos
        if: always()
        run: |
          git config user.name "reel-agent"
          git config user.email "reel-agent@users.noreply.github.com"
          git add -A queue.json state.json media
          if ! git diff --cached --quiet; then
            git commit -q -m "agent: ${{ inputs.command }}"
            git pull -q --rebase
            git push -q
          fi
