# Temporary: checks text sources and fonts on GitHub's machines.
name: diagnose
on:
  push:
    paths: ['.github/workflows/diagnose.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== alquran.cloud pl editions"; curl -s "https://api.alquran.cloud/v1/edition?language=pl" | head -c 1500; echo
          echo "== ayah 94:5 editions"; curl -s "https://api.alquran.cloud/v1/ayah/94:5/editions/quran-uthmani,en.sahih,pl.bielawski" | head -c 1500; echo
          echo "== fawaz pl list"; curl -s "https://cdn.jsdelivr.net/gh/fawazahmed0/quran-api@1/editions.json" | python3 -c "import sys,json;d=json.load(sys.stdin);print({k:v.get('name') for k,v in d.items() if 'pol' in k})"
          echo "== quran.com pl"; curl -s "https://api.quran.com/api/v4/resources/translations?language=pl" | head -c 800; echo
          echo "== everyayah reciters"; curl -s "https://everyayah.com/data/recitations.js" | grep -io '"subfolder":"[^"]*"' | head -80
          sudo apt-get install -y -qq fonts-hosny-amiri fonts-inter libraqm0 > /dev/null; pip install -q pillow
          fc-list | grep -iE "amiri|inter" | head
          python3 -c "from PIL import features;print('raqm',features.check('raqm'), features.version('raqm'))"
