# Every 10 minutes (each run listens to Telegram for 9 minutes): read Telegram buttons, post approved Reels, and design the day's Reel
name: poll
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reel-agent
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-hosny-amiri fonts-inter libraqm0 fontconfig > /dev/null
          pip install -q requests pillow
      - name: Run agent
        id: run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_USER: ${{ secrets.UPLOADPOST_USER }}
          POSTER: ${{ vars.POSTER }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          POLL_MINUTES: '9'
        run: python -m agent.main poll
      - name: Save queue, state and videos
        if: always()
        run: |
          git config user.name "reel-agent"
          git config user.email "reel-agent@users.noreply.github.com"
          git add -A queue.json state.json media
          if ! git diff --cached --quiet; then
            git commit -q -m "agent: poll"
            git pull -q --rebase
            git push -q
          fi
