# Every 15 minutes: read Telegram buttons, post approved Reels, and design each day's Reel
name: poll
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: reel-agent
  cancel-in-progress: false
jobs:
  agent:
    uses: ./.github/workflows/_run.yml
    with:
      command: poll
    secrets: inherit
