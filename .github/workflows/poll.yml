# Every 10 minutes (each run listens to Telegram for 9 minutes): read Telegram buttons, post approved Reels, and design the day's Reel
name: poll
on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '17 * * * *'      # hourly backup trigger: GitHub sometimes skips frequent schedules
  workflow_dispatch:
permissions:
  contents: write
  actions: write            # lets a run start the next one while a Reel is waiting or approved
concurrency:
  group: reel-agent
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # newest state, on the branch (not the commit the run was queued at)
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-hosny-amiri fonts-inter libraqm0 fontconfig > /dev/null
          pip install -q requests pillow
      - name: Run agent
        id: run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_USER: ${{ secrets.UPLOADPOST_USER }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          POSTER: ${{ vars.POSTER }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          POLL_MINUTES: '9'
        run: python -m agent.main poll
      - name: Save queue, state and videos
        if: always()
        run: |
          git config user.name "reel-agent"
          git config user.email "reel-agent@users.noreply.github.com"
          git add -A queue.json state.json media
          if ! git diff --cached --quiet; then
            git commit -q -m "agent: poll"
            git pull -q --rebase -X theirs origin main
            git push -q origin HEAD:main
          fi
      - name: Keep listening
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's 10-minute timer is unreliable, so each run starts the next one and the bot
          # keeps listening. GitHub keeps at most one run waiting, so this never piles up.
          gh workflow run poll.yml --ref main -R "$GITHUB_REPOSITORY"
