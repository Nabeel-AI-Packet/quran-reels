# Manual only: design a Reel right now (tap "Run workflow" in GitHub).
name: make-now
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: reel-agent
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-hosny-amiri fonts-inter libraqm0 fontconfig > /dev/null
          pip install -q requests pillow
      - name: Run agent
        id: run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_USER: ${{ secrets.UPLOADPOST_USER }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          POSTER: ${{ vars.POSTER }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m agent.main make
      - name: Save queue, state and videos
        if: always()
        run: |
          git config user.name "reel-agent"
          git config user.email "reel-agent@users.noreply.github.com"
          git add -A queue.json state.json media suggestions.json
          if ! git diff --cached --quiet; then
            git commit -q -m "agent: make"
            git pull -q --rebase
            git push -q
          fi
      - name: Start listening for the buttons
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run poll.yml --ref "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY"
